vr_mode_DESC="Set to 1 to enable VR headset support (experimental)"
monitor="0"
monitor_DESC="Windows only, borderless full screen: the screen (1 or more) the simulator opens on when it is started directly. 0: it asks which screen, when there are several. From the launcher, the screen picker always asks (and offers the last choice again)."
console_monitor="0"
console_monitor_DESC="Windows only: screen (1 or more) for the instrument console when the simulator is started directly; the console then fills it and the bridge view keeps its own screen. 0: the console stays in the bridge view. From the launcher, the screen picker chooses it."
